name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: .\setup.bat
      - name: Compile the helper
        run: node scripts/build-helper.js
      - name: Unit tests
        run: node tests/unit.js
